<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>쇼핑 리스트</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }

    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 480px;
      height: fit-content;
      overflow: hidden;
    }

    .header {
      background: #4f46e5;
      color: white;
      padding: 24px;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .header .count {
      font-size: 13px;
      opacity: 0.75;
    }

    .input-area {
      padding: 20px;
      border-bottom: 1px solid #f1f5f9;
      display: flex;
      gap: 8px;
    }

    .input-area input {
      flex: 1;
      padding: 10px 14px;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-area input:focus {
      border-color: #4f46e5;
    }

    .input-area input::placeholder {
      color: #94a3b8;
    }

    .input-area button {
      padding: 10px 18px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 22px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      line-height: 1;
    }

    .input-area button:hover {
      background: #4338ca;
    }

    .input-area button:active {
      transform: scale(0.95);
    }

    .input-area button:disabled {
      background: #a5b4fc;
      cursor: default;
      transform: none;
    }

    .list {
      padding: 12px 0;
      min-height: 60px;
    }

    .empty {
      text-align: center;
      color: #94a3b8;
      font-size: 14px;
      padding: 32px 0;
    }

    .loading {
      text-align: center;
      color: #94a3b8;
      font-size: 14px;
      padding: 32px 0;
    }

    .item {
      display: flex;
      align-items: center;
      padding: 12px 20px;
      gap: 12px;
      transition: background 0.15s;
      animation: slideIn 0.2s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .item:hover {
      background: #f8fafc;
    }

    .item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #4f46e5;
      cursor: pointer;
      flex-shrink: 0;
    }

    .item-text {
      flex: 1;
      font-size: 15px;
      color: #1e293b;
      transition: color 0.2s;
      word-break: break-all;
    }

    .item.checked .item-text {
      text-decoration: line-through;
      color: #94a3b8;
    }

    .delete-btn {
      background: none;
      border: none;
      color: #cbd5e1;
      font-size: 18px;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 6px;
      transition: color 0.2s, background 0.2s;
      flex-shrink: 0;
    }

    .delete-btn:hover {
      color: #ef4444;
      background: #fef2f2;
    }

    .footer {
      padding: 14px 20px;
      border-top: 1px solid #f1f5f9;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .footer span {
      font-size: 13px;
      color: #64748b;
    }

    .clear-btn {
      background: none;
      border: none;
      font-size: 13px;
      color: #ef4444;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      transition: background 0.2s;
    }

    .clear-btn:hover {
      background: #fef2f2;
    }

    .clear-btn:disabled {
      color: #cbd5e1;
      cursor: default;
      background: none;
    }

    .error-msg {
      text-align: center;
      color: #ef4444;
      font-size: 13px;
      padding: 8px 20px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🛒 쇼핑 리스트</h1>
      <div class="count" id="count">항목 없음</div>
    </div>

    <div class="input-area">
      <input
        type="text"
        id="item-input"
        placeholder="추가할 항목을 입력하세요"
        maxlength="100"
        autocomplete="off"
      >
      <button id="add-btn" title="추가">+</button>
    </div>

    <div class="error-msg" id="error-msg"></div>

    <div class="list" id="list">
      <div class="loading" id="loading-msg">불러오는 중...</div>
      <div class="empty" id="empty-msg" style="display:none">아직 항목이 없어요.<br>위에서 추가해 보세요!</div>
    </div>

    <div class="footer">
      <span id="checked-count"></span>
      <button class="clear-btn" id="clear-btn" disabled>완료 항목 삭제</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL  = 'https://feycnxfnwlrneylllemh.supabase.co';
    const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZleWNueGZud2xybmV5bGxsZW1oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0NjE4NjUsImV4cCI6MjA5NTAzNzg2NX0.dlTtx-v3BDUz4hWjrTINufjWXPlKHmrzFZpnYus72FM';

    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON);

    const input        = document.getElementById('item-input');
    const addBtn       = document.getElementById('add-btn');
    const list         = document.getElementById('list');
    const loadingMsg   = document.getElementById('loading-msg');
    const emptyMsg     = document.getElementById('empty-msg');
    const countEl      = document.getElementById('count');
    const checkedCountEl = document.getElementById('checked-count');
    const clearBtn     = document.getElementById('clear-btn');
    const errorMsg     = document.getElementById('error-msg');

    let items = [];

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.style.display = 'block';
      setTimeout(() => { errorMsg.style.display = 'none'; }, 3000);
    }

    function render() {
      list.querySelectorAll('.item').forEach(el => el.remove());

      loadingMsg.style.display = 'none';
      emptyMsg.style.display = items.length === 0 ? 'block' : 'none';

      items.forEach(item => {
        const el = document.createElement('div');
        el.className = 'item' + (item.checked ? ' checked' : '');
        el.dataset.id = item.id;
        el.innerHTML = `
          <input type="checkbox" ${item.checked ? 'checked' : ''} data-id="${item.id}">
          <span class="item-text">${escapeHtml(item.text)}</span>
          <button class="delete-btn" data-id="${item.id}" title="삭제">✕</button>
        `;
        list.appendChild(el);
      });

      const total   = items.length;
      const checked = items.filter(i => i.checked).length;

      countEl.textContent = total === 0 ? '항목 없음' : `총 ${total}개`;
      checkedCountEl.textContent = total > 0 ? `${checked}/${total} 완료` : '';
      clearBtn.disabled = checked === 0;
    }

    async function loadItems() {
      const { data, error } = await db
        .from('shopping_items')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) { showError('불러오기 실패: ' + error.message); loadingMsg.style.display = 'none'; return; }
      items = data;
      render();
    }

    async function addItem() {
      const text = input.value.trim();
      if (!text) { input.focus(); return; }

      addBtn.disabled = true;
      const { data, error } = await db
        .from('shopping_items')
        .insert({ text, checked: false })
        .select()
        .single();
      addBtn.disabled = false;

      if (error) { showError('추가 실패: ' + error.message); return; }
      items.unshift(data);
      render();
      input.value = '';
      input.focus();
    }

    async function toggleItem(id, checked) {
      const { error } = await db
        .from('shopping_items')
        .update({ checked })
        .eq('id', id);

      if (error) { showError('수정 실패: ' + error.message); render(); return; }
      const item = items.find(i => i.id === id);
      if (item) item.checked = checked;
      render();
    }

    async function deleteItem(id) {
      const { error } = await db
        .from('shopping_items')
        .delete()
        .eq('id', id);

      if (error) { showError('삭제 실패: ' + error.message); return; }
      items = items.filter(i => i.id !== id);
      render();
    }

    async function clearChecked() {
      const { error } = await db
        .from('shopping_items')
        .delete()
        .eq('checked', true);

      if (error) { showError('삭제 실패: ' + error.message); return; }
      items = items.filter(i => !i.checked);
      render();
    }

    function escapeHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    list.addEventListener('change', e => {
      if (e.target.type === 'checkbox') {
        const id = e.target.dataset.id;
        const item = items.find(i => i.id === id);
        if (item) {
          item.checked = e.target.checked;
          render();
          toggleItem(id, e.target.checked);
        }
      }
    });

    list.addEventListener('click', e => {
      const btn = e.target.closest('.delete-btn');
      if (btn) deleteItem(btn.dataset.id);
    });

    clearBtn.addEventListener('click', clearChecked);
    addBtn.addEventListener('click', addItem);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') addItem(); });

    loadItems();
  </script>
</body>
</html>
